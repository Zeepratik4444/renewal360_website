# renewal360.in: the marketing website (static files built from site/).
# The app lives at copilot.renewal360.in (its own nginx site, not this file).
#
# Files: /var/www/renewal360/dist -> /var/www/renewal360/releases/<timestamp>
# Keep googlea03baa7136a2a67e.html in every release (Search Console verification).

# Markdown copy of each page (for AI agents) points back at the HTML page.
map $uri $r360_md_canonical {
    default              "";
    "/index.md"          "https://renewal360.in/";
    "~^(?<mdp>/.+)\.md$" "https://renewal360.in$mdp";
}

server {
    listen 80;
    listen [::]:80;
    server_name renewal360.in www.renewal360.in;
    return 301 https://renewal360.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.renewal360.in;
    ssl_certificate     /etc/letsencrypt/live/renewal360.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renewal360.in/privkey.pem;
    return 301 https://renewal360.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name renewal360.in;
    ssl_certificate     /etc/letsencrypt/live/renewal360.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renewal360.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/renewal360/dist;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Link '</llms.txt>; rel="llms-txt"' always;
    add_header Content-Usage "train-ai=y" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain text/markdown application/json;

    # One URL per page: strip a trailing slash (old links like /blog/x/ split Search Console data).
    rewrite ^/(.+)/$ /$1 permanent;

    # Pages folded into /product, and old sitemaps already submitted to search engines.
    location = /features         { return 301 /product; }
    location = /how-it-works     { return 301 /product; }
    location = /glimpses         { return 301 /product; }
    location = /privacy          { return 301 /terms#privacy; }
    location = /sitemap-pages.xml { return 301 /sitemap.xml; }
    location = /sitemap-blog.xml  { return 301 /sitemap.xml; }
    location = /manifest.json     { return 301 /site.webmanifest; }
    location ^~ /blog/index.html  { return 301 /blog; }

    # The app's API is on its own host; nothing to serve here.
    location ^~ /api/ { return 404; }

    # Markdown twins. add_header here replaces the server-level ones, so repeat them.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Link '<$r360_md_canonical>; rel="canonical"' always;
        add_header Content-Usage "train-ai=y" always;
        expires 1h;
        try_files $uri =404;
    }

    location ~ ^/llms(-full)?\.txt$ {
        default_type text/plain;
        charset utf-8;
        add_header X-Robots-Tag "noindex" always;
        expires 1h;
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 1d;
    }

    location /assets/fonts/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*";
    }

    # CSS and JS are versioned with ?v=<hash>.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(img|video)/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/index.html =404;
        expires 1h;
    }

    access_log /var/log/nginx/renewal360.access.log;
    error_log  /var/log/nginx/renewal360.error.log;
}
